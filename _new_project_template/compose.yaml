########################### STACK PROPERTIES
name: "<PROJECT_NAME>"

########################### SECRETS
# secrets:
#   PROJECT_SECRET1:
#     file: ${DOCKER_SECRETS:?}/<PROJECT_SECRETS>

########################### SERVICES  
services:
  <PROJECT_NAME>:
    image: <REPO/SERVICE>:${IMAGE_TAG:-latest}
    container_name: "<PROJECT_NAME>"
    restart: unless-stopped
    user: ${PUID_DOCKER:?}:${PGID_DOCKER:?}       ## Overrides the user used to run the container process.
    ports:
      - "${HOST_IP:?}:2000:2000"
    ## File containing environment variables to be inserted into the container
    # env_file: 
    #   - .env.<PROJECT_NAME>
    environment:
      - TZ=${TZ:-Europe/Berlin}    
    ## Add secrets needed by the container
    # secrets:
    #   - PROJECT_SECRET1 
    volumes:
      - "${DOCKER_VOLUMES:?}/<PROJECT_NAME>/data:/data" 

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.<PROJECT_NAME>.entrypoints=https-internal"    ## "https-internal"; or "https-external"; or addtional traefik router/s needed for different config
      - "traefik.http.routers.<PROJECT_NAME>.rule=Host(`<PROJECT_NAME>.${DOMAIN_NAME:-home.arpa}`)"
      - "traefik.http.routers.<PROJECT_NAME>.tls.certresolver=letsencrypt" ## letsencrypt; letsencrypt_dns; letsencrypt_testing
      - "traefik.http.routers.<PROJECT_NAME>.service=<PROJECT_NAME>"
      - "traefik.http.services.<PROJECT_NAME>.loadbalancer.server.url=http://${HOST_IP:?}:2000"
      