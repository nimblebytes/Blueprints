########################### STACK PROPERTIES
name: "pihole-ipvlan"

########################### NETWORKS
networks:
  dmz_ipvlan:
    name: dmz_ipvlan
    external: true
      
########################### SECRETS
secrets:
  webpassword:
    file: ${DOCKER_SECRETS:?}/pihole_webui_password   ## Only needed during container creation

########################### SERVICES
services:
  pihole:
    image: pihole/pihole:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-pihole-ipvlan}
    hostname: ${HOSTNAME}
    restart: unless-stopped
    ## Recommended but not required (DHCP needs NET_ADMIN):  https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    # cap_add:
    #   - NET_ADMIN

    networks:
      dmz_ipvlan:
        ipv4_address: ${CONTAINER_IP_IPVLAN}
#    ports:
#      - "${CONTAINER_IP_IPVLAN}:53:53/tcp"
#      - "${CONTCONTAINER_IP_IPVLANAINER_IP}:53:53/udp"
#      - "${CONTAINER_IP_IPVLAN}:8081:80/tcp"
    env_file: 
      - .env.pihole
    secrets:
      - webpassword                               ## Password is only set during container creation. Changing password and restarting does not work.
    volumes:
      - ${CONTAINER_VOLUME:?}/pihole:/etc/pihole
      - ${CONTAINER_VOLUME:?}/dnsmasq.d:/etc/dnsmasq.d
      - ${CONTAINER_VOLUME:?}/pihole.log:/var/log/pihole.log
